// ---- Progress analysis: every scored attempt is kept on this device, per target language ----
const PROGRESS_KEY = "sunsathiyaiProgress";
const MASTERED = 85, WEAK = 60;
function loadProgress(){
  try { const v = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch { return []; }
}
function saveProgress(list){
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(list.slice(-2000))); } catch { /* storage full or blocked */ }
}
function recordAttempt(value, heardText){
  if (!String(heardText || "").trim() || typeof value !== "number") return;
  const rpg = S.tab === "rpg" && S.rpgSelected !== null;
  const list = loadProgress();
  list.push({ l: S.target, p: rpg ? "r" + S.rpgSelected : "s" + S.station, c: rpg ? "rpg" : (STATIONS[S.station] || {}).category, s: value, t: Date.now() });
  saveProgress(list);
}
function dayKey(ts){ const d = new Date(ts); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function streakDays(list){
  const days = new Set(list.map(a => dayKey(a.t)));
  const d = new Date();
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(dayKey(d.getTime()))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function startOfDay(ts){ const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function nextDay(ts){ const d = new Date(ts); d.setDate(d.getDate() + 1); return d.getTime(); }
function longestStreak(list){
  const days = [...new Set(list.map(a => startOfDay(a.t)))].sort((a, b) => a - b);
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev !== null && nextDay(prev) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}
const STREAK_MILESTONES = [3, 7, 14, 30];
function renderStreak(list, sum, t, ui){
  const bcp = (LANGS.find(l => l.code === ui) || LANGS[1]).bcp;
  const counts = new Map();
  for (const a of list) { const d = startOfDay(a.t); counts.set(d, (counts.get(d) || 0) + 1); }
  const today = startOfDay(Date.now());
  const doneToday = counts.has(today);
  const best = longestStreak(list);
  const days = [];
  const d = new Date(today); d.setDate(d.getDate() - 13);
  for (let k = 0; k < 14; k++) { days.push(d.getTime()); d.setDate(d.getDate() + 1); }
  const wd = new Intl.DateTimeFormat(bcp, { weekday: "narrow" });
  const cells = days.map(day => {
    const n = counts.get(day) || 0, dt = new Date(day);
    return `<div class="streak-day" data-on="${n > 0}" data-today="${day === today}" title="${dt.toLocaleDateString(bcp)} · ${n} ${t.streakAttemptsOn}"><span class="streak-wd">${wd.format(dt)}</span><span class="streak-num">${dt.getDate()}</span><span class="streak-dot">${n > 0 ? "🔥" : "·"}</span></div>`;
  }).join("");
  const status = doneToday ? t.streakDone : sum.streak > 0 ? t.streakKeep.replace("{n}", sum.streak) : t.streakStart;
  const badges = STREAK_MILESTONES.map(m => `<span class="streak-badge" data-earned="${best >= m}">${best >= m ? "🏅" : "🔒"} ${t.streakDayUnit.replace("{n}", m)}</span>`).join("");
  return `<div class="brutal-card p-6 sm:p-8 streak-panel">
    <div class="streak-now"><p class="font-mono text-xs uppercase text-g-purple">${t.streakTitle}</p>
      <p class="font-display text-7xl text-g-red ${sum.streak > 0 ? "streak-flame" : ""}">${sum.streak}🔥</p>
      <p class="text-sm font-semibold">${t.streakDays}</p></div>
    <div class="space-y-3 min-w-0"><div class="flex items-center justify-between gap-2"><span class="font-mono text-xs uppercase text-muted-foreground">${t.streakLast14}</span><span class="font-mono text-xs text-muted-foreground">${t.streakBest}: <b class="text-g-yellow">${best}</b></span></div>
      <div class="streak-days">${cells}</div>
      <div class="streak-status" data-done="${doneToday}"><span class="text-sm font-semibold">${status}</span>${doneToday ? "" : `<a href="#metro" class="btn-gemini shrink-0 px-4 py-2 text-xs uppercase">${t.streakPractiseNow}</a>`}</div></div>
    <div class="space-y-3"><p class="font-mono text-xs uppercase text-muted-foreground">${t.streakMilestones}</p><div class="streak-badges">${badges}</div></div>
  </div>`;
}
function bestByPhrase(list){
  const best = new Map();
  for (const a of list) {
    if (a.p[0] !== "s") continue;
    const k = a.l + ":" + a.p.slice(1);
    best.set(k, Math.max(best.get(k) ?? 0, a.s));
  }
  return best;
}
function summarize(list){
  const best = bestByPhrase(list);
  const avg = list.length ? Math.round(list.reduce((n, a) => n + a.s, 0) / list.length) : 0;
  const mastered = [...best.values()].filter(v => v >= MASTERED).length;
  return { attempts: list.length, avg, best, mastered, practised: best.size, streak: streakDays(list), last: list.length ? list[list.length - 1].t : null };
}
function timeAgo(ts, ui){
  const bcp = (LANGS.find(l => l.code === ui) || LANGS[1]).bcp;
  const rtf = new Intl.RelativeTimeFormat(bcp, { numeric: "auto" });
  const sec = Math.round((ts - Date.now()) / 1000);
  const steps = [[60, "second"], [3600, "minute", 60], [86400, "hour", 3600], [604800, "day", 86400], [Infinity, "week", 604800]];
  for (const [limit, unit, div] of steps) if (Math.abs(sec) < limit) return rtf.format(Math.round(sec / (div || 1)), unit);
  return "";
}
function scoreTone(v){ return v >= MASTERED ? "text-g-green" : v >= WEAK ? "text-g-yellow" : "text-g-red"; }
function sparkline(list){
  const pts = list.slice(-20).map(a => a.s);
  if (pts.length < 2) return `<p class="font-mono text-xs text-muted-foreground">${pts.length ? pts[0] + "/100" : "—"}</p>`;
  const w = 300, h = 90, step = w / (pts.length - 1), y = v => h - 6 - (v / 100) * (h - 12);
  const line = pts.map((v, i) => `${(i * step).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" class="prog-spark" preserveAspectRatio="none" role="img" aria-label="Score trend">
    <line x1="0" x2="${w}" y1="${y(MASTERED)}" y2="${y(MASTERED)}" class="prog-spark-goal"/>
    <polyline points="${line}" class="prog-spark-line"/>
    ${pts.map((v, i) => `<circle cx="${(i * step).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" class="prog-spark-dot ${scoreTone(v)}"/>`).join("")}
  </svg>`;

function norm(s){
  return String(s || "")
    .toLowerCase()
    .normalize("NFC")
    .replace(/[0-9]/g, d => ({"1":"एक","2":"दो","3":"तीन","4":"चार","5":"पाँच"}[d] || d))
    .replace(/[\p{P}\p{S}]/gu, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function score(exp, heard){
  const a = Array.from(norm(exp).replace(/ /g, ""));
  const b = Array.from(norm(heard).replace(/ /g, ""));
  if (!a.length || !b.length) return 0;
  const dp = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++){
    let prev = dp[0];
    dp[0] = i;
    for (let j = 1; j <= b.length; j++){
      const t = dp[j];
      dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = t;
    }
  }
  return Math.max(0, Math.round((1 - dp[b.length] / Math.max(a.length, b.length)) * 100));
}

function computeWordFeedback(expectedText, heardText){
  const expWords = norm(expectedText).split(" ").filter(Boolean);
  const heardWords = norm(heardText).split(" ").filter(Boolean);
  if (!heardWords.length) return [];
  return expWords.map(w => {
    const exact = heardWords.includes(w);
    const fuzzy = heardWords.some(h => score(w, h) >= 65);
    return {
      word: w,
      status: exact ? "matched" : fuzzy ? "close" : "missed"
    };
  });
}

function reset(){
  S.score = null;
  S.heard = null;
  S.err = null;
}

function setPhase(p){
  S.phase = p;
  render();
}

function encodeWAV(samples, sampleRate = 16000){
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  function writeString(offset, str){
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }
  writeString(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, 1, true); // 1 channel
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, "data");
  view.setUint32(40, samples.length * 2, true);
  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2){
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: "audio/wav" });
}

function browserSpeak(textToSpeak){
  if (!("speechSynthesis" in window)){
    S.err = { text: "Speech playback isn't supported in this browser." };
    return setPhase("idle");
  }
  const u = new SpeechSynthesisUtterance(textToSpeak);
  u.lang = LANGS.find(l => l.code === S.target).bcp;
  u.rate = S.speed || 0.9;
  u.onend = () => setPhase("idle");
  u.onerror = () => { S.err = { key: "playFailed" }; setPhase("idle"); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function hear(textOverride){
  reset();
  setPhase("speaking");
  const targetText = textOverride || (
    S.tab === "rpg" && S.rpgSelected !== null
      ? RPG_PHRASES[S.rpgSelected][S.target][0]
      : STATIONS[S.station][S.target][0]
  );
  try {
    const r = await fetch("/api/public/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: targetText,
        language: S.target,
        speed: S.speed || 0.9,
        model: S.model,
        voice: S.voice
      })
    });
    if (!r.ok) throw new Error("tts " + r.status);
    const url = URL.createObjectURL(await r.blob());
    const a = new Audio(url);
    a.onended = () => { URL.revokeObjectURL(url); setPhase("idle"); };
    a.onerror = () => { URL.revokeObjectURL(url); browserSpeak(targetText); };
    await a.play();
  } catch (e) {
    console.warn("Gnani TTS proxy failed, using browser speech synthesis fallback", e);
    browserSpeak(targetText);
  }
}

async function startWavRecording(){
  reset();
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const source = audioCtx.createMediaStreamSource(mediaStream);
    scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
    pcmChunks = [];
    scriptProcessor.onaudioprocess = e => {
      pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    };
    source.connect(scriptProcessor);
    scriptProcessor.connect(audioCtx.destination);
    isRecordingWav = true;
    setPhase("recording");
  } catch (err) {
    console.warn("MediaRecorder/AudioContext error, falling back to Web Speech", err);
    fallbackWebSpeech();
  }
}

async function stopWavRecording(){
  if (!isRecordingWav) return;
  isRecordingWav = false;
  setPhase("checking");

  if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }

  const totalLen = pcmChunks.reduce((acc, c) => acc + c.length, 0);
  if (totalLen < 6000){
    S.err = { text: "Recording too short. Please speak clearly." };
    setPhase("idle");
    return;
  }

  const merged = new Float32Array(totalLen);
  let offset = 0;
  for (const c of pcmChunks){
    merged.set(c, offset);
    offset += c.length;
  }
  pcmChunks = [];

  const wavBlob = encodeWAV(merged, 16000);

  try {
    const fd = new FormData();
    fd.append("file", wavBlob, "recording.wav");
    fd.append("language", S.target);
    const r = await fetch("/api/public/stt", { method: "POST", body: fd });
    const data = await r.json();

    if (!r.ok) {
      if (data.keyMissing) {
        S.err = { text: "Gnani API key missing in .env. Note: Speech recognition fallback is ready in Chrome/Edge." };
        setTimeout(() => fallbackWebSpeech(), 400);
        return;
      }
      throw new Error(data.error || "STT failed");
    }

    const transcript = (data.transcript || "").trim();
    S.heard = transcript;
    const expected = S.tab === "rpg" && S.rpgSelected !== null
      ? RPG_PHRASES[S.rpgSelected][S.target][0]
      : STATIONS[S.station][S.target][0];
    S.score = score(expected, transcript);
    recordAttempt(S.score, transcript);
    setPhase("idle");
  } catch (e) {
    console.warn("STT error:", e);
    S.err = { text: e.message || "Failed to transcribe audio via Gnani STT" };
    setPhase("idle");
  }
}

function fallbackWebSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    S.err = { key: "micBlocked" };
    return render();
  }
  rec = new SR();
  rec.lang = LANGS.find(l => l.code === S.target).bcp;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  let text = "";
  rec.onresult = e => { text = Array.from(e.results).map(r => r[0].transcript).join(" "); };
  rec.onerror = e => {
    S.err = (e.error === "not-allowed" || e.error === "service-not-allowed")
      ? { key: "micBlocked" }
      : { key: "genericError" };
  };
  rec.onend = () => {
    rec = null;
    if (!S.err) {
      S.heard = text;
      const expected = S.tab === "rpg" && S.rpgSelected !== null
        ? RPG_PHRASES[S.rpgSelected][S.target][0]
        : STATIONS[S.station][S.target][0];
      S.score = score(expected, text);
      recordAttempt(S.score, text);
    }
    setPhase("idle");
  };
  try {
    rec.start();
    setPhase("recording");
  } catch {
    S.err = { key: "genericError" };
    render();
  }
}

function toggleMic(){
  if (S.phase === "recording"){
    if (isRecordingWav) stopWavRecording();
    else if (rec) rec.stop();
    return;
  }
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    startWavRecording();
  } else {
    fallbackWebSpeech();
  }
}

      <span class="font-mono text-xs uppercase tracking-wider text-muted-foreground font-bold">${t.categoryLabel || "Categories"} (7 modules · 54 phrases):</span>
      <span class="font-mono text-xs text-g-yellow">Selected: ${activeCat.icon} ${catDisplayName} (${catSentences.length})</span>
    </div>
    <div class="flex flex-wrap gap-2">
      ${CATEGORIES.map(cat => {
        const count = STATIONS.filter(s => s.category === cat.id).length;
        const catName = cat[S.applyUi ? S.native : "name"] || cat.name;
        const isActive = S.category === cat.id;
        return `
          <button data-cat="${cat.id}" data-active="${isActive}" class="btn-outline-gemini px-3 py-2 text-xs font-bold transition-all ${isActive ? 'scale-[1.03] ring-2 ring-foreground' : ''}">
            <span>${cat.icon}</span> <span>${catName}</span> <span class="opacity-75 font-mono text-[11px]">(${count})</span>
          </button>
        `;
      }).join("")}
    </div>
   </div>

   <!-- Sentence Chips for Active Category -->
   <div class="space-y-2">
    <span class="font-mono text-xs uppercase tracking-wider text-muted-foreground">Select phrase to practice:</span>
    <div class="grid grid-cols-2 gap-2.5 sm:grid-cols-4">
      ${catSentences.map((s, idx) => {
        const isSel = S.station === s.id;
        return `
          <button data-station="${s.id}" data-active="${isSel}" class="btn-outline-gemini p-3 text-left transition-all ${isSel ? 'ring-2 ring-foreground scale-[1.02]' : ''}">
            <div class="flex items-center justify-between">
              <span class="font-mono text-[10px] font-bold opacity-75">#0${idx + 1}</span>
              ${isSel ? '<span class="h-2 w-2 rounded-full bg-g-green animate-pulse"></span>' : ''}
            </div>
            <span class="mt-1 block font-bold text-xs truncate">${s.title}</span>
            <span class="mt-1 block font-mono text-[11px] text-g-yellow truncate">${s[S.target][0]}</span>
          </button>
        `;
      }).join("")}
    </div>
   </div>

   <!-- Active Practice Hero Card -->
   <div class="brutal-card grid gap-8 p-6 sm:p-10 md:grid-cols-[1fr_auto] md:items-center">
    <div class="space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-foreground/20 pb-3">
        <span class="inline-flex items-center gap-2 font-mono text-xs uppercase text-g-purple font-bold">
          <span>${activeCat.icon}</span>
          <span>${catDisplayName}</span>
          <span class="text-muted-foreground">· Phrase ${curIdxInCat + 1} of ${catSentences.length}</span>
        </span>
        <div class="flex items-center gap-2">
          <button data-nav-sentence="prev" ${curIdxInCat <= 0 ? 'disabled' : ''} class="btn-outline-gemini px-2.5 py-1 font-mono text-xs font-bold disabled:opacity-40" title="Previous phrase">← Prev</button>
          <span class="font-mono text-xs font-bold">${curIdxInCat + 1}/${catSentences.length}</span>
          <button data-nav-sentence="next" ${curIdxInCat >= catSentences.length - 1 ? 'disabled' : ''} class="btn-outline-gemini px-2.5 py-1 font-mono text-xs font-bold disabled:opacity-40" title="Next phrase">Next →</button>
        </div>
      </div>

      <span class="font-mono text-xs uppercase text-muted-foreground block">${t.sayThis.replace("{lang}",tgtName)}</span>
      <p class="font-display text-3xl sm:text-5xl leading-tight">${ph[0]}</p>
      <p class="font-mono text-sm text-g-yellow">${ph[1]}</p>
      <p class="text-muted-foreground font-medium">“${curSentence.meaning}”</p>

      <div class="flex flex-wrap items-center gap-3 pt-2">
        <button id="hear" ${busy!=="idle"?"disabled":""} class="btn-outline-gemini px-4 py-2 text-sm disabled:opacity-60">${busy==="speaking"?t.speaking:t.hear}</button>
        <button id="speed-btn" class="btn-outline-gemini px-3 py-2 text-xs font-mono" title="Toggle audio speed">${S.speed === 0.7 ? "🐢 0.7x Slow" : "⚡ 0.9x Normal"}</button>
      </div>

      ${S.heard!==null?`
        <div class="space-y-3 rounded-md border-[3px] border-foreground bg-background p-4">
          <div class="flex items-center justify-between"><p class="font-mono text-xs uppercase tracking-wider text-muted-foreground">${t.weHeard}</p><span class="font-mono text-xs text-muted-foreground">16kHz Audio Pipeline</span></div>
          <p class="text-lg font-medium">${esc(S.heard)||t.nothingClear}</p>
          ${S.score!==null?`
            <div class="pt-2 border-t border-foreground/20 space-y-2">
              <div class="flex flex-wrap items-center gap-3">
                <span class="inline-flex items-center gap-2 rounded-md border-2 border-foreground bg-gemini px-3 py-1 font-mono text-xs font-bold text-background">${t.scoreLabel}: ${S.score}/100 ${S.score>=85?"🔥 Great!":S.score>=60?"👍 Good":"🔁 "+t.tryAgain}</span>
                <span class="font-mono text-xs text-muted-foreground">Word Analysis:</span>
              </div>
              <div class="flex flex-wrap gap-2 pt-1">${computeWordFeedback(ph[0], S.heard).map(item=>`<span class="rounded px-2 py-0.5 font-mono text-xs font-bold border-2 ${item.status==='matched'?'border-g-green bg-g-green/20 text-g-green':item.status==='close'?'border-g-yellow bg-g-yellow/20 text-g-yellow':'border-g-red bg-g-red/20 text-g-red'}">${esc(item.word)} ${item.status==='matched'?'✓':item.status==='close'?'≈':'✗'}</span>`).join("")}</div>
            </div>`:""}
        </div>`:""}
      ${errText?`<div class="rounded-md border-2 border-destructive bg-destructive/10 p-3 font-mono text-sm text-destructive flex items-center gap-2"><span>⚠️</span><span>${errText}</span></div>`:""}
    </div>

    <div class="flex flex-col items-center gap-3">
      <button id="mic" ${busy==="speaking"||busy==="checking"?"disabled":""} class="btn-gemini grid h-36 w-36 place-items-center rounded-full text-5xl disabled:opacity-60 ${busy==="recording"?"glow-pulse":""}" aria-label="${busy==="recording"?t.micStop:t.micStart}">${busy==="recording"?"⏹":busy==="checking"?"⏳":"🎙️"}</button>
      ${busy==="recording"?`<div class="flex items-center justify-center gap-1.5 h-6"><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span></div>`:""}
      <span class="font-mono text-xs text-muted-foreground">${busy==="recording"?t.tapToStop:busy==="checking"?t.checking:t.tapToSpeak}</span>
    </div>
   </div>
  </div>`
 : `<div class="space-y-6">
   ${S.rpgSelected === null ? `
    <div class="brutal-card space-y-6 p-6 sm:p-10">
      <div class="flex items-center justify-between">
        <span class="font-mono text-xs uppercase text-g-purple">${t.rpgChapter}</span>
        <span class="rounded-sm border-2 border-foreground bg-gemini px-2 py-0.5 font-mono text-xs font-bold text-background">Scenario 01</span>
      </div>
      <p class="text-xl sm:text-2xl">${t.rpgPre}<b id="rpgname">${nm||""}</b>${t.rpgPost.replace("{lang}",tgtName)}</p>
      <p class="text-sm font-semibold text-muted-foreground">Choose your response to practice in ${tgtName}:</p>
      <div class="grid gap-4 sm:grid-cols-3">
        ${RPG_PHRASES.map((r, i) => `
          <button data-rpg-select="${i}" class="btn-outline-gemini p-5 text-left transition-all hover:scale-[1.02]">
            <span class="block font-mono text-xs opacity-75">Option 0${i+1}</span>
            <span class="mt-1 block font-bold text-base">🎤 ${r.title}</span>
            <span class="mt-2 block font-mono text-xs text-g-yellow">${r[S.target][0]}</span>
          </button>
        `).join("")}
      </div>
    </div>`
   : `
    <div class="brutal-card space-y-6 p-6 sm:p-10">
      <div class="flex items-center justify-between border-b-2 border-foreground/30 pb-3">
        <button data-rpg-back="true" class="btn-outline-gemini px-3 py-1 font-mono text-xs font-bold">← Back to Choices</button>
        <span class="font-mono text-xs uppercase text-g-purple">${RPG_PHRASES[S.rpgSelected].title}</span>
      </div>
      <div class="grid gap-8 md:grid-cols-[1fr_auto] md:items-center">
        <div class="space-y-4">
          <span class="font-mono text-xs uppercase text-muted-foreground">Speak this line in ${tgtName}:</span>
          <p class="font-display text-3xl sm:text-5xl">${RPG_PHRASES[S.rpgSelected][S.target][0]}</p>
          <p class="font-mono text-sm text-g-yellow">${RPG_PHRASES[S.rpgSelected][S.target][1]}</p>
          <p class="text-muted-foreground font-medium">“${RPG_PHRASES[S.rpgSelected][S.target][2]}”</p>
          <div class="flex flex-wrap items-center gap-3">
            <button id="hear" ${busy!=="idle"?"disabled":""} class="btn-outline-gemini px-4 py-2 text-sm disabled:opacity-60">${busy==="speaking"?t.speaking:t.hear}</button>
            <button id="speed-btn" class="btn-outline-gemini px-3 py-2 text-xs font-mono">${S.speed === 0.7 ? "🐢 0.7x Slow" : "⚡ 0.9x Normal"}</button>
          </div>
          ${S.heard !== null ? `
            <div class="space-y-3 rounded-md border-[3px] border-foreground bg-background p-4">
              <p class="font-mono text-xs uppercase tracking-wider text-muted-foreground">${t.weHeard}</p>
              <p class="text-lg font-medium">${esc(S.heard) || t.nothingClear}</p>
              ${S.score !== null ? `
                <div class="pt-2 border-t border-foreground/20 space-y-2">
                  <span class="inline-flex items-center gap-2 rounded-md border-2 border-foreground bg-gemini px-3 py-1 font-mono text-xs font-bold text-background">${t.scoreLabel}: ${S.score}/100 ${S.score >= 85 ? "🔥 Great!" : S.score >= 60 ? "👍 Good" : "🔁 " + t.tryAgain}</span>
                  <div class="flex flex-wrap gap-2 pt-1">${computeWordFeedback(RPG_PHRASES[S.rpgSelected][S.target][0], S.heard).map(item=>`<span class="rounded px-2 py-0.5 font-mono text-xs font-bold border-2 ${item.status==='matched'?'border-g-green bg-g-green/20 text-g-green':item.status==='close'?'border-g-yellow bg-g-yellow/20 text-g-yellow':'border-g-red bg-g-red/20 text-g-red'}">${esc(item.word)} ${item.status==='matched'?'✓':item.status==='close'?'≈':'✗'}</span>`).join("")}</div>
                </div>
              ` : ""}
            </div>
            ${S.score !== null && S.score >= 60 ? `
              <div class="rounded-md border-2 border-g-green bg-g-green/10 p-4 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="font-display text-sm text-g-green">🌟 Mission Complete (+50 XP)</span>
                  <span class="font-mono text-xs text-muted-foreground">Story Progressed</span>
                </div>
                <p class="text-sm font-semibold">${RPG_PHRASES[S.rpgSelected].reply[S.applyUi ? S.native : 'en']}</p>
              </div>
            ` : ""}
          ` : ""}
          ${errText ? `<div class="rounded-md border-2 border-destructive bg-destructive/10 p-3 font-mono text-sm text-destructive flex items-center gap-2"><span>⚠️</span><span>${errText}</span></div>` : ""}
        </div>
        <div class="flex flex-col items-center gap-3">
          <button id="mic" ${busy==="speaking"||busy==="checking"?"disabled":""} class="btn-gemini grid h-36 w-36 place-items-center rounded-full text-5xl disabled:opacity-60 ${busy==="recording"?"glow-pulse":""}">${busy==="recording"?"⏹":busy==="checking"?"⏳":"🎙️"}</button>
          ${busy==="recording"?`<div class="flex items-center justify-center gap-1.5 h-6"><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span></div>`:""}
          <span class="font-mono text-xs text-muted-foreground">${busy==="recording"?t.tapToStop:busy==="checking"?t.checking:t.tapToSpeak}</span>
        </div>
      </div>
    </div>
   `}
   </div>`}
</section>
${renderProgress(t, ui)}
</main>
<footer class="border-t-[3px] border-foreground py-8"><div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-3 px-4 font-mono text-xs text-muted-foreground sm:flex-row lg:px-8"><span>SunSathiyAI</span><span>${t.footer}</span></div></footer>`;

  window.scrollTo({ top: scrollY });
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, a");
  if (!b) return;

  if (b.dataset.native) {
    S.native = b.dataset.native;
    if (S.target === S.native) S.target = LANGS.find(x => x.code !== S.native).code;
    reset();
    render();
  } else if (b.dataset.target) {
    S.target = b.dataset.target;
    reset();
    render();
  } else if (b.dataset.tab) {
    S.tab = b.dataset.tab;
    reset();
    render();
  } else if (b.dataset.cat) {
    S.category = b.dataset.cat;
    const first = STATIONS.find(s => s.category === S.category);
    if (first) S.station = first.id;
    reset();
    render();
  } else if (b.dataset.station !== undefined) {
    S.station = +b.dataset.station;
    reset();
    render();
  } else if (b.dataset.navSentence) {
    const catSentences = STATIONS.filter(s => s.category === S.category);
    const curIdx = catSentences.findIndex(s => s.id === S.station);
    if (b.dataset.navSentence === "prev" && curIdx > 0) {
      S.station = catSentences[curIdx - 1].id;
      reset();
      render();
    } else if (b.dataset.navSentence === "next" && curIdx < catSentences.length - 1) {
      S.station = catSentences[curIdx + 1].id;
      reset();
      render();
    }
  } else if (b.dataset.rpgSelect) {
    S.rpgSelected = +b.dataset.rpgSelect;
    reset();
    render();
  } else if (b.dataset.rpgBack) {
    S.rpgSelected = null;
    reset();
    render();
  } else if (b.dataset.progLang) {
    S.progLang = b.dataset.progLang;
    render();
  } else if (b.dataset.progGoto) {
    const [lc, id] = b.dataset.progGoto.split(":");
    S.target = lc;
    if (S.native === lc) S.native = LANGS.find(x => x.code !== lc).code;
    S.tab = "lessons";
    S.station = +id;
    S.category = STATIONS[+id].category;
    reset();
    render();
    document.getElementById("metro").scrollIntoView({ behavior: "smooth" });
  } else if (b.dataset.progReset) {
    const t = UI[S.applyUi ? S.native : "en"];
    if (confirm(t.progResetConfirm)) { saveProgress([]); S.progLang = "all"; render(); }
  } else if (b.id === "hear") {
    hear();
  } else if (b.id === "mic") {
    toggleMic();
  } else if (b.id === "speed-btn") {
    S.speed = S.speed === 0.9 ? 0.7 : 0.9;
    render();
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "apply") {
    S.applyUi = e.target.checked;
    render();
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "gmodel" || e.target.id === "gvoice") {
    const k = e.target.id === "gmodel" ? "model" : "voice";
    S[k] = e.target.value.trim();
    localStorage.setItem(k === "model" ? "gnaniModel" : "gnaniVoice", S[k]);
    return;
  }
  if (e.target.id !== "nm") return;
  S.name = e.target.value;
  const t = UI[S.applyUi ? S.native : "en"];
  const launchBtn = $("#launch");
  if (launchBtn) launchBtn.textContent = t.launch.replace("{name}", S.name || t.friend);
  const rpgName = $("#rpgname");
  if (rpgName) rpgName.textContent = S.name || "";
});

render();
</script>
</body>
</html>
