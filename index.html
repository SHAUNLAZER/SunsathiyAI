  if(!a.length||!b.length) return 0;
  const dp=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=b.length;j++){const t=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t;}}
  return Math.max(0,Math.round((1-dp[b.length]/Math.max(a.length,b.length))*100));
}

 <div class="brutal-card mx-auto max-w-3xl space-y-8 p-6 sm:p-10">
  <div class="space-y-3"><label for="nm" class="block font-mono text-xs font-semibold uppercase tracking-wider text-muted-foreground">${t.fieldName}</label>

 </div></section>

  <div class="flex gap-3"><button data-tab="lessons" data-active="${S.tab==="lessons"}" class="btn-outline-gemini px-4 py-2 text-sm">${t.tabLessons}</button>
   <button data-tab="rpg" data-active="${S.tab==="rpg"}" class="btn-outline-gemini px-4 py-2 text-sm">${t.tabRpg}</button></div></div>

    ${S.score!==null?`<div class="inline-flex items-center gap-3 rounded-md border-[3px] border-foreground bg-gemini px-4 py-2 font-mono text-sm font-semibold text-background">${t.scoreLabel}: ${S.score}/100 ${S.score>=85?"🔥":S.score>=60?"👍":"🔁 "+t.tryAgain}</div>`:""}
    ${errText?`<p class="font-mono text-sm text-destructive">${errText}</p>`:""}</div>
   <div class="flex flex-col items-center gap-3">
    <button id="mic" ${busy==="speaking"||busy==="checking"?"disabled":""} class="btn-gemini grid h-36 w-36 place-items-center rounded-full text-5xl disabled:opacity-60 ${busy==="recording"?"glow-pulse":""}" aria-label="${busy==="recording"?t.micStop:t.micStart}">${busy==="recording"?"⏹":busy==="checking"?"⏳":"🎙️"}</button>
    <span class="font-mono text-xs text-muted-foreground">${busy==="recording"?t.tapToStop:busy==="checking"?t.checking:t.tapToSpeak}</span></div></div></div>`
 : `<div class="brutal-card space-y-6 p-6 sm:p-10"><span class="font-mono text-xs text-muted-foreground">${t.rpgChapter}</span>
  <p class="text-xl sm:text-2xl">${t.rpgPre}<b id="rpgname">${nm||""}</b>${t.rpgPost.replace("{lang}",tgtName)}</p>
  <div class="grid gap-4 sm:grid-cols-3">${t.rpgChoices.map(c=>`<button class="btn-outline-gemini p-4 text-left text-sm">🎤 ${c}</button>`).join("")}</div></div>`}
</section>

 <div class="flex flex-col justify-between gap-4 border-b-[3px] border-foreground pb-6 md:flex-row md:items-end"><div><span class="font-mono text-xs uppercase text-g-purple">${t.classKicker}</span><h2 class="mt-1 font-display text-3xl uppercase sm:text-5xl">${t.classTitle}</h2></div></div>

 <div class="grid gap-4 md:grid-cols-4">${PIPELINE.map((p,i)=>`<div class="brutal-card space-y-3 p-5"><div class="flex items-center justify-between"><span class="font-display text-3xl text-gemini">0${i+1}</span><span class="h-3 w-3 animate-pulse rounded-full border-2 border-foreground bg-g-green"></span></div><p class="font-mono text-sm">${p}</p><p class="font-mono text-xs text-g-green">${t.online}</p></div>`).join("")}</div></section>

}

function reset(){S.score=null;S.heard=null;S.err=null;}
function setPhase(p){S.phase=p;render();}

function browserSpeak(){
  if(!("speechSynthesis" in window)){S.err={text:"Speech playback isn't supported in this browser."};return setPhase("idle");}
  const u=new SpeechSynthesisUtterance(STATIONS[S.station][S.target][0]);
  u.lang=LANGS.find(l=>l.code===S.target).bcp;
  u.onend=()=>setPhase("idle"); u.onerror=()=>{S.err={key:"playFailed"};setPhase("idle");};
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
async function hear(){
  reset();
  setPhase("speaking");
  try{
    const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:STATIONS[S.station][S.target][0],language:S.target})});
    if(!r.ok) throw new Error("tts "+r.status);
    const url=URL.createObjectURL(await r.blob());
    const a=new Audio(url);
    a.onended=()=>{URL.revokeObjectURL(url);setPhase("idle");};
    a.onerror=()=>{URL.revokeObjectURL(url);browserSpeak();};
    await a.play();
  }catch(e){console.warn("Gnani TTS failed, using browser voice",e);browserSpeak();}
}
function toggleMic(){
  if(S.phase==="recording"){ if(rec) rec.stop(); return; }
  reset();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){S.err={text:"Speech recognition isn't supported in this browser. Please use Chrome or Edge."};return render();}
  rec=new SR(); rec.lang=LANGS.find(l=>l.code===S.target).bcp; rec.interimResults=false; rec.maxAlternatives=1;
  let text="";
  rec.onresult=e=>{text=Array.from(e.results).map(r=>r[0].transcript).join(" ");};
  rec.onerror=e=>{S.err=(e.error==="not-allowed"||e.error==="service-not-allowed")?{key:"mic"}:{key:"generic"};};
  rec.onend=()=>{rec=null; if(!S.err){S.heard=text;S.score=score(STATIONS[S.station][S.target][0],text);} setPhase("idle");};
  try{rec.start();setPhase("recording");}catch{S.err={key:"generic"};render();}
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.native){S.native=b.dataset.native; if(S.target===S.native) S.target=LANGS.find(x=>x.code!==S.native).code; reset(); render();}
  else if(b.dataset.target){S.target=b.dataset.target; reset(); render();}
  else if(b.dataset.tab){S.tab=b.dataset.tab; render();}
  else if(b.dataset.station){S.station=+b.dataset.station; reset(); render();}
  else if(b.id==="hear") hear();
  else if(b.id==="mic") toggleMic();
});
document.addEventListener("change",e=>{ if(e.target.id==="apply"){S.applyUi=e.target.checked; render();} });
document.addEventListener("input",e=>{
  if(e.target.id!=="nm") return;
  S.name=e.target.value; const t=UI[S.applyUi?S.native:"en"];
  $("#launch").textContent=t.launch.replace("{name}",S.name||t.friend);
});
render();
</script>
